name: e4pix
description: "e4pix (easy for pixel) - A high-performance camera tethering and RAW image adjustment workflow editor built with Flutter."
publish_to: "none"
version: 2.9.5+95

environment:
  sdk: ^3.11.0

# ── Windows 打包 ──
msix_config:
  display_name: e4pix
  publisher_display_name: yusuaois
  identity_name: com.yusuaois.e4pix
  msix_version: 2.9.5.95
  logo_path: assets\icon\icon.png
  install_certificate: false

dependencies:
  # ── Flutter SDK ──
  flutter:
    sdk: flutter

  # ── 状态管理 ──
  flutter_riverpod: ^3.3.1

  # ── 主题 / 取色盘 ──
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  flex_color_picker: ^3.8.0
  flutter_launcher_icons: ^0.14.4

  # ── 本地化 ──
  easy_localization: ^3.0.8

  # ── FFI / AI 推理 ──
  ffi: ^2.1.0
  onnxruntime_v2: 1.23.0

  # ── 图像处理 ──
  image: ^4.5.4

  # ── 文件 & 存储 ──
  file_picker: ^12.0.0-beta.5
  path: ^1.9.1
  path_provider: ^2.1.4
  shared_preferences: ^2.5.5
  archive: ^4.0.0

  # ── 网络 ──
  http: ^1.6.0
  url_launcher: ^6.3.2

  # ── 系统 / 设备 ──
  permission_handler: ^12.0.1
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  watcher: ^1.1.1

  # ── 通知 ──
  flutter_local_notifications: ^22.0.1

  # ── UI 组件 ──
  flutter_markdown_plus: ^1.0.7
  visibility_detector: ^0.4.0+2

  # ── 数据格式 ──
  xml: ^7.0.1

dev_dependencies:
  # ── 测试 ──
  flutter_test:
    sdk: flutter

  # ── 代码质量 ──
  flutter_lints: ^6.0.0

  # ── 打包 ──
  msix: ^3.17.0

flutter:
  uses-material-design: true

  assets:
    - assets/changelog/
    - assets/translations/
    - assets/models/
    - assets/presets/
    - assets/borders/logos/dark/
    - assets/borders/logos/light/
    - assets/lensfun/data/db/

  shaders:
    - assets/shaders/denoise.frag
    - assets/shaders/develop.frag
    - assets/shaders/develop_mask.frag
    - assets/shaders/sharpen.frag
    - assets/shaders/perspective.frag
    - assets/shaders/lens_correct.frag
    - assets/shaders/brushes/spot_remove.frag
    - assets/shaders/brushes/healing.frag
    - assets/shaders/brushes/spot_heal.frag
    - assets/shaders/brushes/dodge_burn.frag
    - assets/shaders/brushes/sponge.frag
    - assets/shaders/brushes/history_brush.frag
