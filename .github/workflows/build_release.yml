name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔐 Configure Android Signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../upload-keystore.jks" >> android/key.properties

      - name: 🏗️ Build APK & AAB
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      - name: 🏷️ Rename Artifacts
        run: |
          TOP="$GITHUB_WORKSPACE"
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   "$TOP/e4pix_${{ github.ref_name }}_Android_arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "$TOP/e4pix_${{ github.ref_name }}_Android_armeabi-v7a.apk"
          mv app-x86_64-release.apk      "$TOP/e4pix_${{ github.ref_name }}_Android_x86_64.apk"
          mv app-release.apk             "$TOP/e4pix_${{ github.ref_name }}_Android_universal.apk"
          cd "$TOP"
          mv build/app/outputs/bundle/release/app-release.aab e4pix_${{ github.ref_name }}_Android.aab

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            e4pix_*_Android_*.apk
            # e4pix_*_Android.aab

  build-windows:
    runs-on: windows-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔐 Configure Windows Signing
        run: |
          echo "${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}" | Out-File -Encoding ascii cert_base64.txt
          certutil -decode cert_base64.txt cert.pfx

      - name: 🏗️ Build Windows + Package MSIX
        run: |
          dart run msix:create --certificate-path cert.pfx --certificate-password "${{ secrets.WINDOWS_CERT_PASSWORD }}"

      - name: 🗜️ Compress Portable Build (Zip)
        run: |
          Get-ChildItem build\windows\x64\runner\Release\ -File |
            Where-Object { $_.Extension -ne '.msix' } |
            Compress-Archive -DestinationPath e4pix_${{ github.ref_name }}_Windows_Portable.zip

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            # build/windows/x64/runner/Release/*.msix
            e4pix_*_Portable.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📦 Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgtk-3-dev libglib2.0-dev libnotify-dev

      - name: 📥 Get Dependencies
        run: flutter pub get

      - name: 🏗️ Build Linux Release
        run: flutter build linux --release

      - name: 📦 Package AppImage
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          BUILD_DIR="build/appimage"
          APPDIR="$BUILD_DIR/AppDir"
          OUTPUT="e4pix_${{ github.ref_name }}_Linux_AppImage.AppImage"

          mkdir -p "$BUILD_DIR"

          # Download linuxdeploy
          LINUXDEPLOY="$BUILD_DIR/linuxdeploy-x86_64.AppImage"
          if [ ! -f "$LINUXDEPLOY" ]; then
            wget -q -O "$LINUXDEPLOY" \
              "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
            chmod +x "$LINUXDEPLOY"
          fi

          # Download GTK plugin
          PLUGIN_GTK="$BUILD_DIR/linuxdeploy-plugin-gtk.sh"
          if [ ! -f "$PLUGIN_GTK" ]; then
            wget -q -O "$PLUGIN_GTK" \
              "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
            chmod +x "$PLUGIN_GTK"
          fi

          # Create AppDir from Flutter bundle
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          cp -R "$BUNDLE_DIR"/* "$APPDIR/"

          # Create .desktop entry
          mkdir -p "$APPDIR/usr/share/applications"
          cat > "$APPDIR/usr/share/applications/e4pix.desktop" << 'EOF'
          [Desktop Entry]
          Name=e4pix
          Comment=RAW Photo Editor
          Exec=e4pix
          Icon=e4pix
          Type=Application
          Categories=Graphics;Photography;
          EOF

          # Copy app icon
          if [ -f "assets/icon/icon.png" ]; then
            mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
            cp "assets/icon/icon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/e4pix.png"
            cp "assets/icon/icon.png" "$APPDIR/e4pix.png"
          fi

          export LDAI_OUTPUT="$OUTPUT"
          export DEPLOY_GTK_VERSION=3

          # Run linuxdeploy (fallback to --appimage-extract-and-run if FUSE unavailable)
          "$LINUXDEPLOY" --appdir "$APPDIR" \
            --executable "$APPDIR/e4pix" \
            --desktop-file "$APPDIR/usr/share/applications/e4pix.desktop" \
            --plugin gtk \
            --output appimage 2>&1 || {
              "$LINUXDEPLOY" --appimage-extract-and-run --appdir "$APPDIR" \
                --executable "$APPDIR/e4pix" \
                --desktop-file "$APPDIR/usr/share/applications/e4pix.desktop" \
                --plugin gtk \
                --output appimage
            }

          # Rename if needed
          for f in e4pix-*.AppImage; do
            if [ -f "$f" ] && [ "$f" != "$OUTPUT" ]; then
              mv "$f" "$OUTPUT"
              break
            fi
          done

          ls -lh "$OUTPUT"

      - name: 🗜️ Compress Portable Build (tar.gz)
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/e4pix_${{ github.ref_name }}_Linux_Portable.tar.gz" .

      - name: 📦 Package Debian (.deb)
        run: |
          RAW="${{ github.ref_name }}"
          VERSION="${RAW#v}"                           # strip leading 'v' if present
          VERSION_CLEAN=$(echo "$VERSION" | sed 's/[^0-9.]//g')  # ensure digits only
          [ -z "$VERSION_CLEAN" ] && VERSION_CLEAN="0.0.0"
          BUNDLE="build/linux/x64/release/bundle"
          DEB_DIR="build/deb/e4pix_${VERSION}_amd64"
          DEB_FILE="e4pix_${VERSION}_Linux_amd64.deb"

          mkdir -p "$DEB_DIR/opt/e4pix"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$DEB_DIR/DEBIAN"

          # Copy Flutter bundle
          cp -R "$BUNDLE"/* "$DEB_DIR/opt/e4pix/"

          # .desktop entry
          cat > "$DEB_DIR/usr/share/applications/e4pix.desktop" << 'EOF'
          [Desktop Entry]
          Name=e4pix
          Comment=RAW Photo Editor
          Exec=/opt/e4pix/e4pix
          Icon=e4pix
          Type=Application
          Categories=Graphics;Photography;
          EOF

          # Icon
          if [ -f "assets/icon/icon.png" ]; then
            cp "assets/icon/icon.png" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/e4pix.png"
          fi

          # DEBIAN control
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: e4pix
          Version: ${VERSION_CLEAN}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: yusuaois
          Description: RAW photo editor with AI-powered color grading and tethered shooting.
           e4pix is a cross-platform RAW photo adjustment and camera tethering tool.
           It supports RAW decoding via LibRaw, GPU shader-based real-time preview,
           AI segmentation via EdgeSAM, and USB tethered shooting via gPhoto2.
          Homepage: https://github.com/yusuaois/e4pix
          Depends: libgtk-3-0, libglib2.0-0, libnotify4
          EOF

          dpkg-deb --build --root-owner-group "$DEB_DIR" "$DEB_FILE"
          ls -lh "$DEB_FILE"

      - name: 📤 Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            e4pix_*_Linux_AppImage.AppImage
            e4pix_*_Linux_Portable.tar.gz
            e4pix_*_Linux_amd64.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📥 Get Dependencies
        run: flutter pub get

      - name: 🔧 Build Native Framework
        run: |
          mkdir -p build/macos_framework/build

          # Build universal binary
          cmake -S native/raw_bridge -B build/macos_framework/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON

          cmake --build build/macos_framework/build --config Release -j$(sysctl -n hw.logicalcpu)

          # Locate the built dylib
          DYLIB=$(find build/macos_framework/build -name "libe4pix_raw.dylib" -type f | head -1)

          # Create .framework bundle structure
          FW="build/macos_framework/e4pix_raw.framework"
          mkdir -p "$FW/Versions/A/Resources"

          cp "$DYLIB" "$FW/Versions/A/e4pix_raw"

          install_name_tool -id "@rpath/e4pix_raw.framework/e4pix_raw" \
            "$FW/Versions/A/e4pix_raw"

          ln -sf A "$FW/Versions/Current"
          ln -sf Versions/Current/e4pix_raw "$FW/e4pix_raw"
          ln -sf Versions/Current/Resources "$FW/Resources"

          cat > "$FW/Versions/A/Resources/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key> <string>en</string>
              <key>CFBundleExecutable</key>          <string>e4pix_raw</string>
              <key>CFBundleIdentifier</key>          <string>com.yusuaois.e4pix.raw</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key>                <string>e4pix_raw</string>
              <key>CFBundlePackageType</key>         <string>FMWK</string>
              <key>CFBundleVersion</key>             <string>1.0</string>
          </dict>
          </plist>
          PLIST

          echo "Framework built: $(file "$FW/Versions/A/e4pix_raw")"

      - name: 🏗️ Build macOS Release
        run: flutter build macos --release

      - name: 📦 Bundle Framework into .app
        run: |
          mkdir -p build/macos/Build/Products/Release/e4pix.app/Contents/Frameworks/
          cp -R build/macos_framework/e4pix_raw.framework \
            build/macos/Build/Products/Release/e4pix.app/Contents/Frameworks/

      - name: 💿 Create DMG
        run: |
          APP="build/macos/Build/Products/Release/e4pix.app"
          DMG="e4pix_${{ github.ref_name }}_macOS.dmg"
          hdiutil create -volname "e4pix" -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: 📤 Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            e4pix_*_macOS.dmg

  create-release:
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 📝 Clean Changelog & Inject SHA
        run: |
          SHA_VALUE="${{ github.sha }}"
          sed "s|__SHA__|${SHA_VALUE}|g" ./CHANGELOG.md > temp_changelog.md
          perl -0777 -pe 's/^##[^\n]*\s+(?=^##|^---)//gms' temp_changelog.md > release_body.md

      - name: ✅ Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.Release }}
          files: release-artifacts/*
          body_path: ./release_body.md
          generate_release_notes: false
