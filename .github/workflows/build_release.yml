name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔐 Configure Android Signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../upload-keystore.jks" >> android/key.properties

      - name: 🏗️ Build APK & AAB
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      - name: 🏷️ Rename Artifacts
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   e4pix_${{ github.ref_name }}_Android_arm64-v8a.apk
          mv app-armeabi-v7a-release.apk e4pix_${{ github.ref_name }}_Android_armeabi-v7a.apk
          mv app-x86_64-release.apk      e4pix_${{ github.ref_name }}_Android_x86_64.apk
          mv app-release.apk             e4pix_${{ github.ref_name }}_Android_universal.apk
          cd "$GITHUB_WORKSPACE"
          mv build/app/outputs/bundle/release/app-release.aab e4pix_${{ github.ref_name }}_Android.aab

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/e4pix_*.apk
            e4pix_*.aab

  build-windows:
    runs-on: windows-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🏗️ Build Windows
        run: flutter build windows --release

      - name: 🗜️ Compress Windows Build (Zip)
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath e4pix_${{ github.ref_name }}_Windows.zip

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: e4pix_*.zip

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 📝 Clean Changelog & Inject SHA
        run: |
          SHA_VALUE="${{ github.sha }}"
          sed "s|__SHA__|${SHA_VALUE}|g" ./CHANGELOG.md > temp_changelog.md
          perl -0777 -pe 's/^##[^\n]*\s+(?=^##|^---)//gms' temp_changelog.md > release_body.md

      - name: ✅ Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.Release }}
          files: release-artifacts/*
          body_path: ./release_body.md
          generate_release_notes: false
